name: Update sites.html from OMS

on:
  schedule:
    # 07:45 KST every day, after the data-hub oms-collector (07:30 KST).
    # GitHub cron uses UTC.
    - cron: "45 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "OMS data date in YYYY-MM-DD. Empty means today in Asia/Seoul."
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  update-sites:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # OMS rows come from the data hub (playtag-ops-data-hub.oms.site_daily),
      # read keylessly via Workload Identity (main branch only).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/850943911231/locations/global/workloadIdentityPools/github/providers/github
          service_account: cam-sites-reader@playtag-ops-data-hub.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Export OMS rows from data hub
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          DATE="${INPUT_DATE:-$(TZ=Asia/Seoul date +%F)}"
          if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid date: $DATE" >&2
            exit 1
          fi
          bq query --project_id=playtag-ops-data-hub --nouse_legacy_sql --quiet \
            --format=json --max_rows=100000 \
            "SELECT raw FROM \`playtag-ops-data-hub.oms.site_daily\` WHERE snapshot_date = '$DATE'" \
            > "$RUNNER_TEMP/oms.json"
          ROWS=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).length)' "$RUNNER_TEMP/oms.json")
          if [ "$ROWS" -eq 0 ]; then
            echo "No OMS rows in data hub for $DATE" >&2
            exit 1
          fi
          echo "OMS_DATE=$DATE" >> "$GITHUB_ENV"

      - name: Generate sites.html
        run: |
          node scripts/generate-sites-html.js --input "$RUNNER_TEMP/oms.json" \
            --source "playtag-ops-data-hub.oms.site_daily (snapshot_date=$OMS_DATE)" \
            --output sites.html

      - name: Commit changes
        run: |
          if git diff --quiet -- sites.html; then
            echo "sites.html is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites.html
          git commit -m "Update sites.html from OMS"
          git push
